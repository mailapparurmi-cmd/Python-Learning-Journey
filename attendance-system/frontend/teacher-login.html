<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login - Smart Attendance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #219a52; }
        .error { color: red; text-align: center; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #27ae60; text-decoration: none; }
        .back-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
        
        <h2>👨‍🏫 Teacher Login</h2>
        
        <input type="email" id="email" placeholder="Email Address" value="prof.sharon@attendance.com">
        <input type="password" id="password" placeholder="Password" value="teacher123">
        
        <button onclick="login()">Login</button>
        
        <div class="link">
            <a href="teacher-signup.html">New Teacher? Register here</a>
        </div>
        
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch('http://localhost:5000/api/teacher/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('teacher', JSON.stringify(data.teacher));
                window.location.href = 'teacher-dashboard.html';
            } else {
                document.getElementById('errorMsg').innerText = data.message;
            }
        }
    </script>
</body>
</html>
